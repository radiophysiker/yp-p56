
version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: gophermart-postgres
    environment:
      POSTGRES_USER: gopher
      POSTGRES_PASSWORD: gopher
      POSTGRES_DB: gophermart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gopher -d gophermart"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}